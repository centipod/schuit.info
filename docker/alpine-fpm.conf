[global]
daemonize = no
error_log = /proc/self/fd/2
[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
security.limit_extensions = .php
