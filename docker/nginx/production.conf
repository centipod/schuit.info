# HTTP server - redirect to HTTPS
server {
    listen 80;
    server_name _;
    server_tokens off;

    # Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Redirect all other HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    server_name _;
    server_tokens off;
    client_max_body_size 64m;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/${domain_name}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${domain_name}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

    # Maintenance mode check
    set $maintenance 0;
    if (-f /opt/genealogy/maintenance/.maintenance) {
        set $maintenance 1;
    }

    # Serve maintenance page when enabled
    if ($maintenance) {
        root /var/www/maintenance;
        index index.html;
        try_files /index.html =503;
    }

    # WordPress login/protection rate limiting
    location = /wp-login.php {
        limit_req zone=login burst=5 nodelay;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /xmlrpc.php {
        deny all;
        return 403;
    }

    location = /readme.html {
        deny all;
        return 404;
    }

    location = /license.txt {
        deny all;
        return 404;
    }

    location = /wp-admin/install.php {
        deny all;
        return 404;
    }

    # webtrees routing
    location /tree/ {
        limit_req zone=general burst=20 nodelay;
        alias /var/www/current/webtrees/;
        index index.php;
        try_files $uri $uri/ /tree/index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            include fastcgi_params;
        }
    }

    # WordPress routing
    location / {
        limit_req zone=general burst=20 nodelay;
        root /var/www/current/wordpress;
        index index.php;
        try_files $uri $uri/ /index.php$is_args$args;

        location ~ \.php$ {
            fastcgi_pass unix:/run/php/php-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
