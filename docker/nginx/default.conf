# Rate limiting zones (must be at http level, not server level)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

server {
  listen 80;
  server_name localhost _;
  client_max_body_size 64m;

  # WordPress login/protection rate limiting
  location = /wp-login.php {
    limit_req zone=login burst=5 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://wordpress/;
  }

  location = /xmlrpc.php {
    # Block xmlrpc - not needed for modern WordPress setups
    deny all;
    return 403;
  }

  location = /tree {
    return 301 /tree/;
  }

  location /tree/ {
    limit_req zone=general burst=20 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /tree;
    proxy_pass http://webtrees/tree/;
  }

  location / {
    limit_req zone=general burst=20 nodelay;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://wordpress/;
  }
}
