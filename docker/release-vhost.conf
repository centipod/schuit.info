<VirtualHost *:8080>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        Options -Indexes
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
