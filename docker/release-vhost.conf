<VirtualHost *:8080>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        Require all granted
        AllowOverride None
        Options -Indexes
        FallbackResource /index.php
    </Directory>
    ErrorLog /proc/self/fd/2
    # Never retain OAuth authorization codes, state or referrers in access logs.
    LogFormat "%a %t \"%m %U %H\" %>s %b" schuit_safe
    CustomLog /proc/self/fd/1 schuit_safe
</VirtualHost>
