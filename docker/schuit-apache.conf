<Directory /var/www/html/tree>
    Options -Indexes
    AllowOverride None
    FallbackResource /tree/index.php
</Directory>
<DirectoryMatch "^/var/www/html/tree/(data|config|vendor|app|resources|modules_v4|media)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)\.(ged|gedcom|ini|sql|bak|log)(\.|$)">
    Require all denied
</FilesMatch>
