<Directory /var/www/html/tree>
    Options -Indexes
    AllowOverride None
    FallbackResource /tree/index.php
</Directory>
<DirectoryMatch "^/var/www/html/tree/(data|config|vendor|app|resources|modules_v4|media)(/|$)">
    Require all denied
</DirectoryMatch>
<FilesMatch "(?i)\.(ged|gedcom|ini|sql|bak|log)(\.|$)">
    Require all denied
</FilesMatch>

# Application-local protections: do not modify the shared HTTPS proxy.
ServerTokens Prod
ServerSignature Off
TraceEnable Off
<Directory /var/www/html>
    Options -Indexes
</Directory>
<Directory /var/www/html/wp-content/uploads>
    AllowOverride None
    Options -Indexes -ExecCGI
    <FilesMatch "(?i)\.(php[0-9]*|phtml|pht|phar)(\.|$)">
        Require all denied
    </FilesMatch>
    <FilesMatch "(?i)\.(svgz?|xml|xsl|xslt|xhtml|html?|ps|eps|mvg|msl)(\.|$)">
        Require all denied
    </FilesMatch>
</Directory>
<LocationMatch "(?i)^/(wp-admin/(install|setup-config)\.php|xmlrpc\.php|readme\.html|license\.txt|tree/(README|SECURITY|CONTRIBUTING|LICENSE)\.md)$">
    Require all denied
</LocationMatch>
<FilesMatch "(?i)(^\.|\.(sql|bak|old|orig|save)$)">
    Require all denied
</FilesMatch>
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "SAMEORIGIN"
Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
# Deliberately excludes includeSubDomains: unrelated sites are outside this scope.
Header always set Strict-Transport-Security "max-age=31536000"

<Location "/.well-known/security.txt">
    Require all granted
    ForceType text/plain
</Location>
