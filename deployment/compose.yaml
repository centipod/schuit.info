name: schuit
services:
  web:
    image: centipod-schuit:php8.3.36-20261026
    container_name: schuit-web
    restart: unless-stopped
    user: '33:33'
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    cgroup_parent: apps.slice
    environment:
      WEBTREES_METRICS_PATH: /run/schuit-metrics/metrics.json
      WEBTREES_CONFIG_PATH: /var/www/html/tree/data/config.ini.php
      SCHUIT_IMPORT_ARCHIVE: /var/www/html/tree/data/import-originals
    volumes:
      - /srv/schuit/wordpress:/var/www/html:ro
      - /srv/schuit/uploads:/var/www/html/wp-content/uploads:rw
      - /srv/schuit/webtrees:/var/www/html/tree:ro
      - /srv/schuit/webtrees-data:/var/www/html/tree/data:rw
      - /srv/schuit/webtrees-media:/var/www/html/tree/media:rw
      - /srv/schuit/metrics:/run/schuit-metrics:rw
      - /etc/centipod/schuit/wp-config.php:/var/www/html/wp-config.php:ro
      - /etc/centipod/schuit/webtrees.ini.php:/var/www/html/tree/data/config.ini.php:ro
      - /opt/apps/schuit/wordpress-theme/schuit-portal:/var/www/html/wp-content/themes/schuit-portal:ro
      - /opt/apps/schuit/modules_v4:/var/www/html/tree/modules_v4:ro
      - /opt/apps/schuit/wordpress-mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - /opt/apps/schuit/scripts:/opt/schuit-scripts:ro
      - /opt/apps/schuit/logo.png:/var/www/html/logo.png:ro
      - /opt/apps/schuit/banner.png:/var/www/html/banner.png:ro
    tmpfs:
      - /tmp:rw,nosuid,noexec,size=256m,uid=33,gid=33
      - /var/run/apache2:rw,nosuid,noexec,size=4m,uid=33,gid=33
      - /var/lock/apache2:rw,nosuid,noexec,size=4m,uid=33,gid=33
    healthcheck:
      test: [CMD, php, /opt/schuit-scripts/health.php]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
    networks: [database, web]
networks:
  database:
    name: schuit-db
    external: true
  web:
    name: schuit-web
    internal: true
