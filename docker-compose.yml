services:
  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - wordpress
      - webtrees
    ports:
      - "${LOCAL_PORT:-8081}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

  wordpress-db:
    image: mysql:8.4.5
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MYSQL_USER: ${WORDPRESS_DB_USER:-wordpress}
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress-pass}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-wordpress-root-pass}
    volumes:
      - wordpress-db:/var/lib/mysql

  wordpress:
    image: ${WORDPRESS_IMAGE:-wordpress:latest}
    depends_on:
      - wordpress-db
    environment:
      WORDPRESS_DB_HOST: wordpress-db:3306
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress-pass}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:${LOCAL_PORT:-8081}');
        define('WP_SITEURL', 'http://localhost:${LOCAL_PORT:-8081}');
        define('DISABLE_WP_CRON', true);
        define('FORCE_SSL_ADMIN', false);
    volumes:
      - wordpress-data:/var/www/html
      - ./wordpress-theme/schuit-portal:/var/www/html/wp-content/themes/schuit-portal:ro
      - ./wordpress-mu-plugins:/var/www/html/wp-content/mu-plugins:ro
      - ./logo.png:/var/www/html/logo.png:ro
      - ./banner.png:/var/www/html/banner.png:ro

  webtrees-db:
    image: mysql:8.4.5
    command: --character-set-server=utf8mb3 --collation-server=utf8mb3_unicode_ci
    environment:
      MYSQL_DATABASE: ${WEBTREES_DB_NAME:-webtrees}
      MYSQL_USER: ${WEBTREES_DB_USER:-webtrees}
      MYSQL_PASSWORD: ${WEBTREES_DB_PASSWORD:-webtrees-pass}
      MYSQL_ROOT_PASSWORD: ${WEBTREES_DB_ROOT_PASSWORD:-webtrees-root-pass}
    volumes:
      - webtrees-db:/var/lib/mysql

  webtrees:
    build:
      context: ./docker/webtrees
      args:
        WEBTREES_VERSION: ${WEBTREES_VERSION:-2.1.27}
    depends_on:
      - webtrees-db
    environment:
      WEBTREES_DB_HOST: webtrees-db:3306
      WEBTREES_DB_NAME: ${WEBTREES_DB_NAME:-webtrees}
      WEBTREES_DB_USER: ${WEBTREES_DB_USER:-webtrees}
      WEBTREES_DB_PASSWORD: ${WEBTREES_DB_PASSWORD:-webtrees-pass}
      WEBTREES_BASE_URL: http://localhost:${LOCAL_PORT:-8081}/tree
      APACHE_DOCUMENT_ROOT: /var/www/html
    volumes:
      - webtrees-data:/var/www/html/data
      - webtrees-media:/var/www/html/media
      - webtrees-config:/var/www/html/config
      - ./modules_v4:/var/www/html/modules_v4:ro

volumes:
  wordpress-db:
  wordpress-data:
  webtrees-db:
  webtrees-data:
  webtrees-media:
  webtrees-config:
